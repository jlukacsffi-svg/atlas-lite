<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Atlas Capital Research investment workspace prototype">
  <title>Atlas Capital Research</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Atlas navigation">
      <a class="brand" href="#today" aria-label="Atlas home">
        <span class="brand-mark">A</span>
        <span><strong>Atlas</strong><small>Capital Research</small></span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link active" href="#today" data-route="today"><i data-lucide="layout-dashboard"></i><span>Today</span></a>
        <a class="nav-link" href="#ideas" data-route="ideas"><i data-lucide="telescope"></i><span>Ideas</span></a>
        <a class="nav-link" href="#portfolio" data-route="portfolio"><i data-lucide="briefcase-business"></i><span>Portfolio</span></a>
        <a class="nav-link" href="#activity" data-route="activity"><i data-lucide="history"></i><span>Activity</span></a>
      </nav>

      <div class="sidebar-footer">
        <a class="nav-link" href="#settings" data-route="settings"><i data-lucide="settings"></i><span>Settings</span></a>
        <div class="mode-status"><span class="status-dot"></span><div><small>Operating mode</small><strong>Paper auto-manage</strong></div></div>
        <button class="profile-button" type="button" aria-label="Open account menu"><span>JL</span><div><strong>Joe Lukacsffi</strong><small>Owner workspace</small></div><i data-lucide="chevrons-up-down"></i></button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
        <div class="global-search">
          <i data-lucide="search"></i>
          <input id="global-search" type="search" placeholder="Search stocks, reports, or topics" autocomplete="off">
          <kbd>/</kbd>
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <div class="top-actions">
          <span class="prototype-badge">Prototype data</span>
          <button class="icon-button" type="button" aria-label="Open 3 alerts" title="Alerts" data-go="alerts"><i data-lucide="bell"></i><span class="notification-dot"></span></button>
          <button class="icon-button" type="button" aria-label="Open help"><i data-lucide="circle-help"></i></button>
        </div>
      </header>

      <div id="page-content" class="page-content" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
